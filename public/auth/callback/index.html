<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 처리 중... | Order Up! — Café Talk</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #FFFDF9;
        color: #431407;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        background: white;
        padding: 36px 28px;
        border-radius: 28px;
        border: 2px solid #FCD8C1;
        box-shadow: 0 12px 36px rgba(251, 146, 60, 0.15);
        max-width: 380px;
        width: 100%;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3.5px solid #FFEDD5;
        border-top-color: #EA580C;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 18px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h2 {
        font-size: 19px;
        font-weight: 800;
        margin: 0 0 8px;
        color: #431407;
      }
      p {
        font-size: 14px;
        color: #7D665E;
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h2>로그인 처리 중입니다</h2>
      <p>잠시만 기다려주세요.<br />자동으로 메인 화면으로 이동합니다.</p>
    </div>

    <script>
      (function() {
        var hash = window.location.hash || '';
        var search = window.location.search || '';

        // 1. If opened in a popup from AI Studio or web app
        if (window.opener) {
          try {
            window.opener.postMessage({
              type: 'SUPABASE_AUTH_SUCCESS',
              hash: hash,
              search: search
            }, '*');
          } catch(e) {}
          setTimeout(function() {
            window.close();
          }, 350);
        } else {
          // 2. If redirected directly in the main browser window on Vercel
          setTimeout(function() {
            window.location.href = '/' + search + hash;
          }, 300);
        }
      })();
    </script>
  </body>
</html>
