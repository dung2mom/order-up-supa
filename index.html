<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function() {
        var isOAuthCallback = window.location.search.includes('code=') || window.location.hash.includes('access_token');
        if (isOAuthCallback) {
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          // 1. Notify opener via postMessage
          if (window.opener) {
            try {
              window.opener.postMessage({
                type: 'SUPABASE_AUTH_SUCCESS',
                hash: hash,
                search: search
              }, '*');
            } catch (e) {}
          }
          // 2. Set localStorage signal for cross-origin opener isolation fallback
          try {
            localStorage.setItem('supabase_auth_event', JSON.stringify({
              type: 'SUPABASE_AUTH_SUCCESS',
              hash: hash,
              search: search,
              time: Date.now()
            }));
          } catch (e) {}
          // 3. Give 500ms for IPC delivery before closing popup
          setTimeout(function() {
            if (window.opener) {
              window.close();
            }
          }, 500);
        }
      })();
    </script>
    <title>Order Up! — Café Talk</title>
    <meta name="description" content="A warm and encouraging English speaking-practice web app for Korean middle school students to practice ordering drinks at a café with barista Mia." />
    <meta property="og:title" content="Order Up! — Café Talk" />
    <meta property="og:description" content="A warm and encouraging English speaking-practice web app for Korean middle school students to practice ordering drinks at a café with barista Mia." />

  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
